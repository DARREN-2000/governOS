services:
  - type: web
    name: governos-node-api
    env: node
    buildCommand: "npm install -g pnpm && cd apps/api && pnpm install && pnpm run build"
    startCommand: "cd apps/api && pnpm start"
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: governos-web
    env: static
    buildCommand: "npm install -g pnpm && cd apps/web && pnpm install && pnpm run build"
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: governos-node-api
          envVarKey: RENDER_EXTERNAL_URL

