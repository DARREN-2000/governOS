services:
  - type: web
    name: governos-node-api
    env: node
    plan: free
    buildCommand: "cd apps/api && npm install --no-package-lock --include=dev && npm run build"
    startCommand: "cd apps/api && node dist/index.js"
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: governos-web
    env: static
    buildCommand: "cd apps/web && npm install --no-package-lock --include=dev && npm run build"
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: governos-node-api
          envVarKey: RENDER_EXTERNAL_URL

